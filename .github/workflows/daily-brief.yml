name: Collect and deliver SIGNAL 10

on:
  schedule:
    # Capture short-lived feed entries without publishing a new edition.
    - cron: '15 */2 * * *'
    # Publish and deliver at 06:30 JST (21:30 UTC on the previous day).
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: signal10-news-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect, deduplicate, rank, and summarize
        env:
          COLLECT_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '15 */2 * * *' }}
          OPENAI_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 21 * * *') && secrets.OPENAI_API_KEY || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OPENAI_VERIFIER_MODEL: ${{ vars.OPENAI_VERIFIER_MODEL || 'gpt-4.1-mini' }}
        run: npm run news:update

      - name: Run ranking and parser tests
        run: npm test

      - name: Verify production build before publishing
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 21 * * *'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_APP_URL }}
        run: npm run build

      - name: Hand validated data to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal10-data-${{ github.run_id }}
          path: |
            data/
            public/data/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Download validated data only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signal10-data-${{ github.run_id }}
          path: .

      - name: Save collection state and the new edition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "signal10-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh AI news $(date -u +%Y-%m-%dT%H:%MZ)"
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" pull --rebase origin "${GITHUB_REF_NAME}"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${GITHUB_REF_NAME}"
            unset auth_header
          fi

  notify:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the validated edition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install notification dependencies
        run: npm ci --ignore-scripts

      - name: Deliver the morning edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: npm run news:notify
