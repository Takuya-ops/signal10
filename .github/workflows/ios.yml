name: Build and test iOS app

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'public/data/latest.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'public/data/latest.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
  schedule:
    # Daily digest commits use GITHUB_TOKEN and cannot trigger another workflow.
    # Run after the 06:30 JST edition to validate the live JSON contract each day.
    - cron: '17 23 * * *'

permissions:
  contents: read

concurrency:
  group: signal10-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Select an available iPhone simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone") and device.get("isAvailable", True)))')"
          echo "DEVICE_ID=${device_id}" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project ios/Signal10.xcodeproj \
            -scheme Signal10 \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Signal10.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal10-ios-test-result
          path: ${{ runner.temp }}/Signal10.xcresult
          if-no-files-found: warn
          retention-days: 7
